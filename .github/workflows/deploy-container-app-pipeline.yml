name: Deploy Container App Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and Test
    uses: ./.github/workflows/build-test-pipeline.yml

  deploy:
    name: Deploy
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Check Out the Code
        uses: actions/checkout@v7

      - name: Log In to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Find the Registry and the Tag
        run: |
          REGISTRY=$(az acr list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[0].loginServer" \
            --output tsv)
          echo "REGISTRY=${REGISTRY:?No registry found in the resource group}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build the Image
        run: |
          docker build \
            --build-arg COMMIT=${{ github.sha }} \
            -t "$REGISTRY/waypoint:$IMAGE_TAG" \
            .

      - name: Push the Image
        run: |
          az acr login --name "${REGISTRY%%.*}"
          docker push "$REGISTRY/waypoint:$IMAGE_TAG"

      - name: Deploy the Infrastructure and the App
        run: |
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main-container-apps.bicep \
            --parameters infra/container-apps.bicepparam \
            --query properties.provisioningState \
            --output tsv

      - name: Run the Smoke Test
        env:
          ATTEMPTS: 30
        run: |
          REVISION_FQDN=$(az containerapp list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[0].properties.latestRevisionFqdn" \
            --output tsv)
          ./scripts/health-check.sh "https://$REVISION_FQDN/health" "${{ github.sha }}"